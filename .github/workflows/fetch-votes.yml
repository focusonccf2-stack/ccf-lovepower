name: 自動抓票並更新網站

on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docs/**"]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: fetch-votes
  cancel-in-progress: false

jobs:
  fetch:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 抓取票數
        run: node scripts/fetch-votes.mjs
      - name: 存檔（記錄歷史）
        run: |
          if git diff --quiet docs/data.json; then echo "沒有變化"; exit 0; fi
          git config user.name "vote-bot"
          git config user.email "vote-bot@users.noreply.github.com"
          git add docs/data.json
          git commit -m "更新票數 $(TZ=Asia/Taipei date '+%m/%d %H:%M')"
          git push

  build:
    needs: fetch
    if: always() && (needs.fetch.result == 'success' || needs.fetch.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
